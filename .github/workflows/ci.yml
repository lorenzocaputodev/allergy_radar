name: CI

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Analisi e test =====
  # Su Windows, come la macchina di sviluppo.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Stessa versione su cui la build è verificata (vedi README).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Fallisce se pubspec.lock non corrisponde a pubspec.yaml.
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  # ===== Build Android =====
  # Build di debug: la chiave di firma delle release resta fuori da GitHub.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gradle 8.14.5 non supporta JDK 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
