version: 2
updates:
  # ===== Pacchetti Dart e Flutter =====
  # Niente aggiornamenti di versione automatici: con pub Dependabot ha ignorato sia la regola
  # sui salti di versione maggiore sia i tetti espliciti (flutter_local_notifications 19 -> 22,
  # che cambia l'API e rompe la build). Restano gli aggiornamenti di sicurezza; il resto si
  # aggiorna a mano con `flutter pub outdated` e i test (docs/development.md, ADR 0009).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # ===== GitHub Actions =====
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  # Gradle, AGP e Kotlin non sono qui di proposito: restano fissati sulla
  # linea 8.x di AGP (vedi README) e si aggiornano a mano.
