version: 2
updates:
  # ===== Pacchetti Dart e Flutter =====
  # Solo aggiornamenti minor e patch, raggruppati in una PR alla settimana.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # I salti di versione maggiore si fanno a mano, uno alla volta.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # La regola sopra da sola non è bastata: in un gruppo Dependabot ha proposto
      # flutter_local_notifications 19 -> 22, che cambia l'API e rompe la build.
      # Qui ogni dipendenza diretta ha un tetto esplicito alla sua versione maggiore.
      - dependency-name: provider
        versions: ['>=7.0.0']
      - dependency-name: shared_preferences
        versions: ['>=3.0.0']
      - dependency-name: http
        versions: ['>=2.0.0']
      - dependency-name: flutter_local_notifications
        versions: ['>=20.0.0']
      - dependency-name: geolocator
        versions: ['>=15.0.0']
      - dependency-name: file_selector
        versions: ['>=2.0.0']
      - dependency-name: flutter_file_dialog
        versions: ['>=4.0.0']
      - dependency-name: path_provider
        versions: ['>=3.0.0']
      - dependency-name: pdf
        versions: ['>=4.0.0']
      - dependency-name: flutter_lints
        versions: ['>=7.0.0']
      # Pacchetti ancora in 0.x: per loro anche un aumento minor può cambiare l'API.
      - dependency-name: workmanager
        versions: ['>=0.10.0']
      - dependency-name: intl
        versions: ['>=0.21.0']
      - dependency-name: flutter_launcher_icons
        versions: ['>=0.14.0']

  # ===== GitHub Actions =====
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  # Gradle, AGP e Kotlin non sono qui di proposito: restano fissati sulla
  # linea 8.x di AGP (vedi README) e si aggiornano a mano.
