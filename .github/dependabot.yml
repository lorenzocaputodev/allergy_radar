version: 2
updates:
  # ===== Pacchetti Dart e Flutter =====
  # Solo aggiornamenti minor e patch, raggruppati in una PR alla settimana.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # I salti di versione maggiore si fanno a mano, uno alla volta.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Pacchetti ancora in 0.x: per loro anche un aumento minor può cambiare l'API.
      - dependency-name: workmanager
        update-types: ['version-update:semver-minor']
      - dependency-name: intl
        update-types: ['version-update:semver-minor']
      - dependency-name: flutter_launcher_icons
        update-types: ['version-update:semver-minor']

  # ===== GitHub Actions =====
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  # Gradle, AGP e Kotlin non sono qui di proposito: restano fissati sulla
  # linea 8.x di AGP (vedi README) e si aggiornano a mano.
