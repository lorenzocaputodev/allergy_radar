name: allergy_radar
description: "App Flutter per seguire pollini e sintomi di allergia nella propria zona."
publish_to: 'none'
version: 1.0.2+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Stato e persistenza
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

  # Dati: Open-Meteo e ISPRA
  http: ^1.6.0

  # Avvisi in background
  flutter_local_notifications: ^19.5.0
  workmanager: ^0.9.0+3
  timezone: ^0.10.1

  # Posizione approssimativa e nome del comune (Geocoder di Android)
  geolocator: ^14.1.1
  geocoding: ^5.0.0

  # File: backup, CSV e PDF
  file_selector: ^1.1.0
  flutter_file_dialog: ^3.3.3
  path_provider: ^2.1.6
  pdf: ^3.12.0

  # Utility
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/launcher/icon_legacy.png"
  adaptive_icon_foreground: "assets/launcher/icon_foreground.png"
  adaptive_icon_background: "#1F5A4A"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  # Font inclusi: nessuna chiamata a Google Fonts a runtime.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-400.ttf
        - asset: assets/fonts/Figtree-500.ttf
          weight: 500
        - asset: assets/fonts/Figtree-600.ttf
          weight: 600
        - asset: assets/fonts/Figtree-700.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
